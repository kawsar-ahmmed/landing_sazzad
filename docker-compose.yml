services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sharighor
      POSTGRES_USER: sharighor
      POSTGRES_PASSWORD: sharighor_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  postgres_data:
